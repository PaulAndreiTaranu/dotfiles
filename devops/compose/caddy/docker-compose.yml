services:
    caddy:
        image: caddy:2-alpine
        container_name: caddy
        restart: unless-stopped
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - ./certs:/etc/caddy/certs:ro
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - proxy

    # Test service — replace with your real apps later
    test-app:
        image: caddy:2-alpine
        container_name: test-app
        restart: unless-stopped
        command: caddy respond --listen :80 "Hello from test.paulandreitaranu.com"
        networks:
            - proxy

volumes:
    caddy_data:
    caddy_config:

networks:
    proxy:
        name: proxy
